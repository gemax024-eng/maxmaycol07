<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escáner QR Pro</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        header {
            margin-bottom: 20px;
            text-align: center;
        }

        header h1 {
            color: #2c3e50;
            font-size: 24px;
            margin-bottom: 5px;
        }

        header p {
            color: #7f8c8d;
            font-size: 14px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        /* Zona de la Cámara */
        #reader-wrapper {
            position: relative;
            width: 100%;
            margin-bottom: 20px;
            border-radius: 8px;
            overflow: hidden;
            background: #2c3e50;
            display: none; /* Se muestra al activar */
        }

        #reader {
            width: 100%;
        }

        /* Botones */
        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s ease;
            text-align: center;
            margin-bottom: 15px;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-stop {
            background-color: #e74c3c;
            display: none;
        }

        /* Historial de Escaneos */
        .history-section {
            margin-top: 25px;
        }

        .history-section h2 {
            font-size: 18px;
            color: #2c3e50;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .clear-btn {
            background: none;
            border: none;
            color: #e74c3c;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
        }

        .history-list {
            list-style: none;
            max-height: 250px;
            overflow-y: auto;
        }

        .history-item {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 8px;
            border-left: 4px solid #2ecc71;
            font-size: 14px;
            word-break: break-all;
        }

        .history-item .meta {
            display: block;
            font-size: 11px;
            color: #95a5a6;
            margin-top: 5px;
        }

        .empty-state {
            text-align: center;
            color: #bdc3c7;
            font-size: 14px;
            padding: 20px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Escáner QR Pro</h1>
        <p>Escanear y registrar datos al instante</p>
    </header>

    <div class="container">
        <button id="start-btn" class="btn">Activar Cámara</button>
        <button id="stop-btn" class="btn btn-stop">Detener Cámara</button>

        <div id="reader-wrapper">
            <div id="reader"></div>
        </div>

        <div class="history-section">
            <h2>
                Historial de Registros
                <button id="clear-btn" class="clear-btn">Limpiar todo</button>
            </h2>
            <ul id="history-list" class="history-list">
                </ul>
        </div>
    </div>

    <script>
        // Elementos del DOM
        const startBtn = document.getElementById('start-btn');
        const stopBtn = document.getElementById('stop-btn');
        const readerWrapper = document.getElementById('reader-wrapper');
        const historyList = document.getElementById('history-list');
        const clearBtn = document.getElementById('clear-btn');

        // Instancia del escáner (se apunta al ID del div contenedor)
        let html5QrCode = new Html5Qrcode("reader");

        // Cargar historial previo desde LocalStorage al iniciar la página
        document.addEventListener('DOMContentLoaded', displayHistory);

        // Evento para iniciar la cámara
        startBtn.addEventListener('click', () => {
            readerWrapper.style.display = 'block';
            startBtn.style.display = 'none';
            stopBtn.style.display = 'block';

            // Configuración para apuntar a la cámara trasera en móviles y definir un área de escaneo (cuadrado)
            const config = { 
                fps: 10, 
                qrbox: { width: 250, height: 250 } 
            };

            html5QrCode.start(
                { facingMode: "environment" }, // Prioriza la cámara trasera
                config,
                onScanSuccess
            ).catch(err => {
                alert(`Error al acceder a la cámara: ${err}`);
                resetUI();
            });
        });

        // Evento para detener la cámara manualmente
        stopBtn.addEventListener('click', stopCamera);

        // Qué hacer cuando se reconoce un código QR con éxito
        function onScanSuccess(decodedText, decodedResult) {
            // Detener la cámara inmediatamente para evitar múltiples lecturas repetidas
            stopCamera();
            
            // Sonido de vibración si el dispositivo lo soporta (feedback táctil)
            if (navigator.vibrate) navigator.vibrate(100);

            // Obtener fecha y hora actual
            const now = new Date();
            const dateTimeStr = now.toLocaleDateString() + ' - ' + now.toLocaleTimeString();

            // Guardar en el almacenamiento local (LocalStorage)
            saveRecord(decodedText, dateTimeStr);
            
            // Refrescar la interfaz para mostrar el nuevo registro
            displayHistory();
        }

        // Apagar la cámara de forma limpia
        function stopCamera() {
            if (html5QrCode && html5QrCode.isScanning) {
                html5QrCode.stop().then(() => {
                    resetUI();
                }).catch(err => console.error("Error al detener la cámara.", err));
            } else {
                resetUI();
            }
        }

        // Resetear la interfaz gráfica de los botones
        function resetUI() {
            readerWrapper.style.display = 'none';
            startBtn.style.display = 'block';
            stopBtn.style.display = 'none';
        }

        // Guardar registro en LocalStorage
        function saveRecord(text, datetime) {
            let records = localStorage.getItem('qr_records') ? JSON.parse(localStorage.getItem('qr_records')) : [];
            // Insertar al inicio para que el último escaneo aparezca primero
            records.unshift({ text, datetime });
            localStorage.setItem('qr_records', JSON.stringify(records));
        }

        // Renderizar el historial guardado
        function displayHistory() {
            historyList.innerHTML = '';
            let records = localStorage.getItem('qr_records') ? JSON.parse(localStorage.getItem('qr_records')) : [];

            if (records.length === 0) {
                historyList.innerHTML = '<li class="empty-state">No hay registros guardados.</li>';
                return;
            }

            records.forEach(record => {
                const li = document.createElement('li');
                li.className = 'history-item';
                
                // Si el texto es un enlace válido, lo hacemos clickeable
                let contentHTML = record.text;
                if(record.text.startsWith('http://') || record.text.startsWith('https://')) {
                    contentHTML = `<a href="${record.text}" target="_blank" style="color:#2980b9; text-decoration:none; font-weight:bold;">${record.text}</a>`;
                }

                li.innerHTML = `
                    <div><strong>Contenido:</strong> ${contentHTML}</div>
                    <span class="meta">📅 Escaneado el: ${record.datetime}</span>
                `;
                historyList.appendChild(li);
            });
        }

        // Limpiar el historial completo
        clearBtn.addEventListener('click', () => {
            if(confirm('¿Estás seguro de que quieres borrar todos los registros?')) {
                localStorage.removeItem('qr_records');
                displayHistory();
            }
        });
    </script>
</body>
</html>
